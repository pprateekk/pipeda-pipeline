version: 2

models:
  - name: marts_pipeda_compliance_report
    config:
      materialized: table
    description: "one row per user per purpose, final compliance audit table"
    columns:
      - name: user_id
        tests:
          - not_null
      - name: purpose
        tests:
          - not_null
      - name: current_consent_status
        tests:
          - not_null
          - accepted_values:
              values: ['granted', 'revoked', 'updated']
              
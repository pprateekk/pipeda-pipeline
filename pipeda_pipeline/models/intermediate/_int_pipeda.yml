version: 2

models:
  - name: int_consent_lifecycle
    config:
      materialized: table
    description: "Every consent event with the policy version active at the time of the event."
    columns:
      - name: event_id
        tests:
          - not_null
          - unique
      - name: policy_version_at_consent
        tests:
          - not_null

  - name: int_dsr_sla_tracking
    config:
      materialized: table
    description: "DSR requests w SLA breach status and days until deadline"
    columns:
      - name: request_id
        tests:
          - not_null
          - unique
      - name: sla_status
        tests:
          - accepted_values:
              values: ['breached', 'critical', 'warning', 'on_track']
              